name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.100
    - name: Restore dependencies
      run: dotnet restore source
    - name: Build
      run: dotnet build source --no-restore
    - name: Test
      run: dotnet test source -f net8.0 --no-build --verbosity normal
    - name: Install NativeAOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: Publish AOT smoke test
      run: dotnet publish source/AotSmokeTest/AotSmokeTest.csproj -c Release -r linux-x64 --self-contained -o publish/AotSmokeTest
    - name: Run AOT smoke test
      run: ./publish/AotSmokeTest/AotSmokeTest
